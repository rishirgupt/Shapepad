name: Release

# Push a tag like `v0.1.0` (matching the version in package.json and
# src-tauri/tauri.conf.json) to trigger a build, or run this manually from
# the Actions tab.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write

    # Windows-only for now: ShapePad's frameless/transparent window,
    # click-through, and full-screen shape capture have only been built and
    # verified on Windows. Add macOS/Linux entries to this matrix once those
    # platforms have actually been tested — publishing untested builds under
    # the ShapePad name would be worse than not publishing them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ShapePad ${{ github.ref_name }}"
          releaseBody: |
            See [PREREQUISITES.md](https://github.com/${{ github.repository }}/blob/main/PREREQUISITES.md)
            for what you need to run this (short version: 64-bit Windows
            10/11, nothing else — WebView2 is bundled in the installer).

            Download either `*_x64-setup.exe` (recommended) or `*_x64_en-US.msi`.
          releaseDraft: true
          prerelease: false
